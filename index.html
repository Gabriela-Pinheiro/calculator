<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="icon" type="image/svg" href="logo2.svg">
</head>
<body>
    <header>
        <h1>Calculator</h1>
    </header>
    
    <main>
        <input type="text" id="currentNumber" name="currentNumber" required>

        <button type="submit" class="number-btn" onclick="updateNumber(1)">1</button>
        <button type="submit" class="number-btn" onclick="updateNumber(2)">2</button>
        <button type="submit" class="number-btn" onclick="updateNumber(3)">3</button>
        <button type="submit" class="number-btn" onclick="updateNumber(4)">4</button>
        <button type="submit" class="number-btn" onclick="updateNumber(5)">5</button>
        <button type="submit" class="number-btn" onclick="updateNumber(6)">6</button>
        <button type="submit" class="number-btn" onclick="updateNumber(7)">7</button>
        <button type="submit" class="number-btn" onclick="updateNumber(8)">8</button>
        <button type="submit" class="number-btn" onclick="updateNumber(9)">9</button>
        <button type="submit" class="number-btn" onclick="updateNumber(0)">0</button>
        <button type="submit" id="operation-btn" onclick="operate('+')">+</button>
        <button type="submit" id="operation-btn" onclick="operate('-')">-</button>
        <button type="submit" id="operation-btn" onclick="operate('*')">*</button>
        <button type="submit" id="operation-btn" onclick="operate('/')">/</button>
        <button type="submit" id="calculation-btn" onclick="updateNumber('.')">.</button>
        <button type="submit" id="calculation-btn" onclick="">AC</button>
        <button type="submit" id="calculation-btn" onclick="">clear</button>
        <button type="submit" id="calculation-btn" onclick="calculate()">=</button>
        
        <div id="result">Result: </div>
    </main>

    <footer>
        <p>&copy; 2026 Calculator App</p>
    </footer>
</body>
</html>
